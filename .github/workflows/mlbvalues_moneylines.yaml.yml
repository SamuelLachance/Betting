on:
 # schedule:
#    - cron: '0 10 * * *'
#    - cron: '55 14 * * *'
#    - cron: '0 16 * * *'
#    - cron: '0 18 * * *'
#    - cron: '0 20 * * *'

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::xml2
            any::tidyr
            any::dplyr
            any::gt
            any::readr
            any::gtExtras
            any::lubridate
            any::webshot2
            any::png
            any::stringr
            any::gsheet


      - name: Check out repository
        uses: actions/checkout@v3

      - name: Run Spoorkbook fade algorithm
        run: Rscript spoorkbook_fade_plays.R
        env:
          SPOORKBOOK_SHEET_URL: ${{ secrets.SPOORKBOOK_SHEET_URL }}

      - name: Import data
        run: Rscript -e 'source("mlb_ml_values.R")'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add MLB_ML_Plays.png Spoorkbook_Fade_Plays.csv Spoorkbook_Fade_Index.csv Spoorkbook_Fade_Plays.png
          git commit -m 'Data updated' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
