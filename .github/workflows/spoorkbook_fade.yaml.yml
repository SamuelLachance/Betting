on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'

jobs:
  spoorkbook-fade:
    runs-on: ubuntu-latest
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::tidyr
            any::dplyr
            any::gt
            any::readr
            any::lubridate
            any::webshot2
            any::stringr
            any::gsheet

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Run Spoorkbook fade algorithm
        run: Rscript spoorkbook_fade_plays.R
        env:
          SPOORKBOOK_SHEET_URL: ${{ secrets.SPOORKBOOK_SHEET_URL }}

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add Spoorkbook_Fade_Index.csv Spoorkbook_Dual_Fade_Games.csv
          git commit -m 'Spoorkbook fade data updated' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
